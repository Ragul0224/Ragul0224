<text x="600" y="168" text-anchor="middle" fill="url(#hero)" font-family="Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="9">RAGUL S</text>
<text x="600" y="208" text-anchor="middle" fill="#E6F1FF" font-family="monospace" font-size="17" letter-spacing="1">FULL STACK WEB DEVELOPER</text>

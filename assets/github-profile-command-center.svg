<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360"><stop stop-color="#020409"/><stop offset=".48" stop-color="#0A1424"/><stop offset="1" stop-color="#020409"/></linearGradient>
<linearGradient id="hero" x1="250" y1="100" x2="950" y2="230"><stop stop-color="#5CC8FF"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9B7CFF"/></linearGradient>
<linearGradient id="beam"><stop stop-color="#58A6FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#58A6FF" stroke-opacity=".075"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>

<g><circle cx="365" cy="0" r="4" fill="#58A6FF" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></g>
<g transform="rotate(125)"><circle cx="300" cy="0" r="3" fill="#BFAEFF" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></g>
<circle r="5" fill="#FFFFFF" filter="url(#glow)"><animate attributeName="r" values="4;9;4" dur="1.7s" repeatCount="indefinite"/></circle><circle r="22" stroke="#58A6FF" stroke-opacity=".25"><animate attributeName="r" values="12;34;12" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<g font-family="monospace" font-size="10" letter-spacing="2" fill="#76B8FF" opacity=".8"><text x="54" y="42">RAGUL.S // WEB.DEVELOPER</text><text x="1146" y="42" text-anchor="end">SYSTEM • ONLINE</text></g><circle cx="1082" cy="38" r="3" fill="#58A6FF"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#030507"/><stop offset=".5" stop-color="#0b1020"/><stop offset="1" stop-color="#030507"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#c6b6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)" opacity=".8">
 <animateTransform attributeName="transform" type="translate" from="0 0" to="42 42" dur="5s" repeatCount="indefinite"/>
</rect>
<g fill="none" stroke="#8ab8ff" stroke-opacity=".18">
 <ellipse cx="970" cy="180" rx="230" ry="82" transform="rotate(-18 970 180)"><animateTransform attributeName="transform" type="rotate" from="-18 970 180" to="342 970 180" dur="14s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="970" cy="180" rx="170" ry="58" transform="rotate(55 970 180)"><animateTransform attributeName="transform" type="rotate" from="55 970 180" to="-305 970 180" dur="10s" repeatCount="indefinite"/></ellipse>
 <circle cx="970" cy="180" r="105"><animate attributeName="r" values="105;118;105" dur="3s" repeatCount="indefinite"/></circle>
</g>
<g filter="url(#glow)">
 <circle cx="970" cy="180" r="5" fill="#fff"><animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="75" r="2.5" fill="#fff"><animate attributeName="cy" values="75;285;75" dur="7s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="280" r="2.5" fill="#c6b6ff"><animate attributeName="cx" values="1080;820;1080" dur="6s" repeatCount="indefinite"/></circle>
</g>
<path d="M0 300 C220 250 360 340 560 285 S900 225 1200 275" fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".65" stroke-dasharray="12 16"><animate attributeName="stroke-dashoffset" from="0" to="-280" dur="4s" repeatCount="indefinite"/></path>
<g font-family="Arial,Helvetica,sans-serif" fill="#fff">
 <text x="70" y="105" font-size="14" letter-spacing="6" fill="#7f8998">FULL STACK DEVELOPER</text>
 <text x="70" y="175" font-size="66" font-weight="800" letter-spacing="-3">RAGUL S</text>
 <text x="74" y="215" font-size="18" fill="#aeb7c4">Python · Django · JavaScript · Web Development</text>
 <text x="74" y="265" font-size="11" letter-spacing="3" fill="#667386">BUILD • LEARN • SHIP • REPEAT</text>
</g>
<rect x="70" y="286" width="280" height="1" fill="#58a6ff" opacity=".5"><animate attributeName="width" values="40;280;40" dur="3.5s" repeatCount="indefinite"/></rect>
</svg>
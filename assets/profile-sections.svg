<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#05070b"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#05070b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".10"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="24" fill="url(#g)"/><rect width="1200" height="420" rx="24" fill="url(#grid)"/><rect x="0" y="0" width="1200" height="420" fill="none" stroke="#58a6ff" stroke-opacity=".16" rx="24"/>
<!-- moving light sweep -->
<rect x="-260" y="0" width="260" height="420" fill="#58a6ff" opacity="0.035"><animate attributeName="x" values="-260;1200;-260" dur="8s" repeatCount="indefinite"/></rect>
<!-- expanding signal rings -->
<g transform="translate(600 210)" fill="none"><circle r="70" stroke="#58a6ff" stroke-opacity=".25"><animate attributeName="r" values="55;175;55" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="5s" repeatCount="indefinite"/></circle><circle r="110" stroke="#8b7cff" stroke-opacity=".16"><animate attributeName="r" values="95;210;95" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="6s" repeatCount="indefinite"/></circle></g>
<!-- rotating network -->
<g transform="translate(600 210)"><ellipse rx="360" ry="105" stroke="#58a6ff" stroke-opacity=".14"/><ellipse rx="270" ry="78" stroke="#8b7cff" stroke-opacity=".14" transform="rotate(-25)"/><g><circle cx="360" cy="0" r="4" fill="#58a6ff" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></g><g transform="rotate(150)"><circle cx="270" cy="0" r="3" fill="#d7e7ff" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g></g>
<circle cx="600" cy="210" r="7" fill="#fff" filter="url(#glow)"><animate attributeName="r" values="5;12;5" dur="1.6s" repeatCount="indefinite"/></circle>
<g fill="#fff" font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="85" font-size="18" fill="#58a6ff" letter-spacing="5">RAGUL S • DEVELOPER PROFILE</text><text x="600" y="145" font-size="34" font-weight="700">BUILDING THE WEB, ONE PROJECT AT A TIME</text><text x="600" y="185" font-size="17" fill="#a9b7ca">Frontend • Backend • APIs • Databases • Deployment</text></g>
<g font-family="Arial" font-size="15" fill="#dbeafe"><text x="130" y="290">PYTHON</text><text x="300" y="290">DJANGO</text><text x="470" y="290">REACT</text><text x="640" y="290">JAVASCRIPT</text><text x="850" y="290">SQL</text><text x="1010" y="290">GIT</text></g>
<g stroke="#58a6ff" stroke-width="3"><path d="M120 315H190"><animate attributeName="x1" values="120;180;120" dur="2s" repeatCount="indefinite"/><animate attributeName="x2" values="190;250;190" dur="2s" repeatCount="indefinite"/></path><path d="M290 315H360"><animate attributeName="x1" values="290;350;290" dur="2.4s" repeatCount="indefinite"/><animate attributeName="x2" values="360;420;360" dur="2.4s" repeatCount="indefinite"/></path><path d="M460 315H530"><animate attributeName="x1" values="460;520;460" dur="2.2s" repeatCount="indefinite"/><animate attributeName="x2" values="530;590;530" dur="2.2s" repeatCount="indefinite"/></path><path d="M630 315H700"><animate attributeName="x1" values="630;690;630" dur="2.6s" repeatCount="indefinite"/><animate attributeName="x2" values="700;760;700" dur="2.6s" repeatCount="indefinite"/></path><path d="M840 315H910"><animate attributeName="x1" values="840;900;840" dur="2.3s" repeatCount="indefinite"/><animate attributeName="x2" values="910;970;910" dur="2.3s" repeatCount="indefinite"/></path><path d="M1000 315H1070"><animate attributeName="x1" values="1000;1060;1000" dur="2.5s" repeatCount="indefinite"/><animate attributeName="x2" values="1070;1130;1070" dur="2.5s" repeatCount="indefinite"/></path></g>
<text x="600" y="370" fill="#8ab8ff" font-family="monospace" font-size="16" text-anchor="middle">CODE → CREATE → LEARN → SHIP → REPEAT</text></svg>